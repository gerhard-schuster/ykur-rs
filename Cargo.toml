[package]
name = "ykurctrl"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "Control application for the Yepkit YKUR USB relay board"
readme = "README.md"
repository = "https://github.com/gerhard-schuster/ykur-rs"
keywords = ["usb", "relay", "hid", "ykur", "yepkit"]
categories = ["command-line-utilities", "hardware-support"]

[lib]
name = "ykur"

[features]
# The FakeBoard test double, so code built on the library can be tested
# without hardware. Off by default.
fake = []

[dependencies]
# Pinned to the revision of sidit77/async-hid#55 on the fork until 0.6.0
# with it is released: #55 adds the exclusive open used on macOS. The
# revision also has the macOS fixes for input report delivery (#46) and for
# feature report reads (#53).
async-hid = { version = "0.6", git = "https://github.com/gerhard-schuster/async-hid", rev = "1d1a2bf422219b1332f1a46ec4b9b1bc1b29e08e" }
# block_on and the stream adapter for enumeration; async-io for the timer the
# read races against, since async-hid has no timed read.
async-io = "2"
futures-lite = "2"

# flock on the hidraw node, so two invocations take turns at a board.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
ykurctrl = { path = ".", features = ["fake"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
